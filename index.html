<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>To my close friend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1c0f1f; --bg2:#2b1530; --rose:#e9a3b8; --rose-d:#c8647f; --gold:#f2cd8f; --ivory:#fbefe6; --muted:#c9b3c2;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif; --sans:"Jost",system-ui,-apple-system,Segoe UI,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#1c0f1f; } }
:root[data-theme="dark"]{ --bg:#1c0f1f; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,var(--bg2),var(--bg) 70%) fixed var(--bg);color:var(--ivory);font-family:var(--sans);font-weight:300;line-height:1.7;overflow-x:hidden}
canvas#petals{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(.8rem,3vw,2.2rem);padding:1rem .5rem;background:linear-gradient(var(--bg),transparent)}
nav a{color:var(--muted);text-decoration:none;font-family:var(--serif);font-style:italic;font-size:clamp(1rem,3.8vw,1.2rem);padding:.2rem .1rem;border-bottom:1px solid transparent;transition:color .3s,border-color .3s}
nav a:hover,nav a.on{color:var(--gold);border-color:var(--gold)}
nav a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
main{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:1rem 1.5rem 5rem}
.page{display:none;animation:in .8s ease both}
.page.on{display:block}
@keyframes in{from{opacity:0}to{opacity:1}}
h1,h2{font-family:var(--serif);font-weight:400;line-height:1.1;margin:0}
h1{font-size:clamp(3rem,13vw,6.2rem);font-style:italic;color:var(--ivory)}
h2{font-size:clamp(2.2rem,7vw,3.4rem);font-style:italic;color:var(--rose);margin-bottom:1.5rem}
p{margin:0 0 1.1rem}
.serif{font-family:var(--serif);font-size:1.35rem}
.hero{min-height:68vh;display:flex;flex-direction:column;justify-content:center;text-align:center;align-items:center}
.hero h1 span.her{color:var(--rose)}
.entry p{font-family:var(--serif);font-style:italic;font-size:clamp(1.3rem,4vw,1.8rem);color:var(--gold);margin:0 0 1.2rem}
.namebox{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center}
input{background:transparent;border:1px solid var(--rose-d);color:var(--ivory);padding:.75rem 1.2rem;border-radius:999px;font:inherit;text-align:center;min-width:13rem}
input::placeholder{color:var(--muted)}
.to{display:none;text-align:center}
.to.on{display:block;animation:in 1s both}
.to .lbl{font-family:var(--sans);font-weight:400;letter-spacing:.3em;text-transform:uppercase;font-size:clamp(.8rem,3vw,1.05rem);color:var(--gold);margin-bottom:.8rem}
.to h1{color:var(--rose);word-break:break-word}
#reveal{display:none;flex-direction:column;align-items:center;margin-top:1.6rem}
#reveal.on{display:flex;animation:in 1.2s ease .4s both}
button,.btn{cursor:pointer;background:var(--rose-d);color:#fff;border:0;padding:.75rem 1.8rem;border-radius:999px;font:500 1rem var(--sans);letter-spacing:.03em;text-decoration:none;display:inline-block;transition:transform .2s,background .2s}
button:hover,.btn:hover{background:var(--rose);color:var(--bg);transform:translateY(-2px)}
.btn.ghost{background:transparent;border:1px solid var(--gold);color:var(--gold)}
.btn.ghost:hover{background:var(--gold);color:var(--bg)}

/* gift + panda */
.stage{position:relative;width:260px;height:350px;margin:0 auto 1rem;clip-path:inset(-140px -140px 0 -140px);transform-origin:50% 100%}
.stage:not(.open){animation:wob 2.8s ease-in-out infinite}
@keyframes wob{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-2.5deg)}84%{transform:rotate(2.5deg)}92%{transform:rotate(-1.5deg)}}
.panda{position:absolute;left:15px;top:20px;width:230px;height:230px;opacity:0;transform:translateY(240px);z-index:1;overflow:visible}
.box{position:absolute;left:35px;bottom:0;width:190px;height:105px;z-index:2}
.lid{position:absolute;left:25px;top:218px;width:210px;height:38px;z-index:3;overflow:visible;transform-origin:15% 100%}
.stage.open .lid{animation:lidoff .9s ease-in forwards}
.stage.open .panda{animation:rise 1.4s cubic-bezier(.2,.9,.3,1.15) .4s forwards}
@keyframes lidoff{to{transform:translate(-80px,-90px) rotate(-38deg);opacity:0}}
@keyframes rise{0%{opacity:0;transform:translateY(240px)}12%{opacity:1}100%{opacity:1;transform:translateY(0)}}
.wave{transform-origin:140px 128px}
.stage.open .wave{animation:wave .9s ease-in-out 1.6s infinite alternate}
@keyframes wave{from{transform:rotate(-8deg)}to{transform:rotate(16deg)}}
.head{transform-origin:100px 130px}
.stage.open .head{animation:tilt 2.4s ease-in-out 1.6s infinite alternate}
@keyframes tilt{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.eye{animation:blink2 4s infinite}
@keyframes blink2{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.sp{position:absolute;opacity:0;font-size:1.3rem;z-index:4;pointer-events:none;color:var(--rose)}
.sp.g{color:var(--gold)}
.stage.open .sp{animation:floaty 3.2s ease-in infinite}
@keyframes floaty{0%{opacity:0;transform:translateY(20px) scale(.6)}20%{opacity:.95}100%{opacity:0;transform:translateY(-80px) scale(1.1)}}
.cap{display:none;font-family:var(--serif);font-style:italic;font-size:clamp(1.3rem,4vw,1.7rem);color:var(--gold)}
.cap.on{display:block;animation:in 1.2s ease 1.2s both}

/* memories */
.lead{color:var(--muted);margin-bottom:1.6rem}
.gallery{columns:2 220px;column-gap:1.4rem}
.gallery figure{break-inside:avoid;margin:0 0 1.6rem;background:var(--ivory);padding:.7rem;border-radius:4px;box-shadow:0 14px 34px #0009;transform:rotate(-1.8deg);transition:transform .35s}
.gallery figure:nth-child(even){transform:rotate(1.6deg)}
.gallery figure:nth-child(3n){transform:rotate(-.6deg)}
.gallery figure:hover{transform:rotate(0) scale(1.03)}
.ph-in{aspect-ratio:4/5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4rem;background:linear-gradient(160deg,#f6cfd9,#e9a3b8 55%,#c8647f);color:#fff;font-size:2.6rem;border-radius:2px}
.ph-in span{font-family:var(--sans);font-size:.85rem;letter-spacing:.04em}

/* letter */
.letter{background:var(--ivory);color:#3b2230;padding:clamp(1.5rem,5vw,3rem);border-radius:6px;box-shadow:0 20px 60px #0008;font-family:var(--serif);font-size:1.35rem;line-height:1.75;min-height:16rem;white-space:pre-wrap}
.ask{text-align:center;margin-top:2.5rem;display:none}
.ask.on{display:block;animation:in 1s both}
.ask h2{margin-bottom:1.2rem}
.ask .row{display:flex;gap:1rem;justify-content:center;align-items:center;min-height:7rem;position:relative}
#yes{font-size:1.2rem}
#no{background:transparent;border:1px solid var(--muted);color:var(--muted);transition:left .25s,top .25s}
#no:hover{background:transparent;color:var(--muted);transform:none}
.win{display:none;text-align:center;margin-top:2.5rem}
.win.on{display:block;animation:in 1s both}
.win h2{font-size:clamp(2.6rem,10vw,4.5rem)}
.popper{position:fixed;bottom:calc(.5rem + env(safe-area-inset-bottom,0px));font-size:3.6rem;line-height:1;z-index:9;pointer-events:none;opacity:0}
.popper.l{left:.6rem}
.popper.r{right:.6rem;transform:scaleX(-1)}
.popper.on{animation:pop 1.6s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:scale(.3) rotate(-20deg)}15%{opacity:1;transform:scale(1.25)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.popper.r.on{animation-name:popr}
@keyframes popr{0%{opacity:0;transform:scaleX(-1) scale(.3) rotate(-20deg)}15%{opacity:1;transform:scaleX(-1) scale(1.25)}30%{transform:scaleX(-1) scale(1)}80%{opacity:1}100%{opacity:0;transform:scaleX(-1)}}
@media (prefers-reduced-motion:reduce){.page,.cap.on,.ask.on,.win.on{animation:none}.eye,.stage:not(.open){animation:none}.stage.open .panda{animation:none;opacity:1;transform:none}.stage.open .lid{animation:none;display:none}.stage.open .wave,.stage.open .head,.stage.open .sp{animation:none}}
</style>
</head>
<body>
<canvas id="petals" aria-hidden="true"></canvas>
<nav aria-label="Pages">
  <a href="#home" data-p="home">Hello</a>
  <a href="#you" data-p="you">Photos</a>
  <a href="#letter" data-p="letter">A letter</a>
</nav>
<span class="popper l" id="pl" aria-hidden="true">🎉</span><span class="popper r" id="pr" aria-hidden="true">🎉</span>
<main>

<section class="page" id="home">
  <div class="hero">
    <div class="entry" id="entry">
      <p>Enter your beautiful name</p>
      <div class="namebox">
        <input id="name" placeholder="Type name here" maxlength="24" aria-label="Your beautiful name" autocomplete="off">
        <button id="setname" type="button">Continue</button>
      </div>
    </div>
    <div class="to" id="to">
      <div class="lbl">To my close friend</div>
      <h1 id="toName"></h1>
    </div>

    <div id="reveal">
    <div class="stage" id="stage">
      <span class="sp" style="left:30px;top:150px;animation-delay:2s">♥</span>
      <span class="sp g" style="left:215px;top:120px;animation-delay:2.7s">✦</span>
      <span class="sp" style="left:225px;top:200px;animation-delay:3.4s">♥</span>
      <span class="sp g" style="left:15px;top:80px;animation-delay:4s">✦</span>
      <span class="sp" style="left:120px;top:10px;animation-delay:4.6s">♥</span>

      <svg class="panda" viewBox="0 0 200 200" aria-label="A cute panda wearing a party hat" role="img">
        <circle cx="58" cy="44" r="18" fill="#2a1a2e"/><circle cx="142" cy="44" r="18" fill="#2a1a2e"/>
        <ellipse cx="68" cy="185" rx="21" ry="14" fill="#2a1a2e"/><ellipse cx="132" cy="185" rx="21" ry="14" fill="#2a1a2e"/>
        <ellipse cx="100" cy="150" rx="52" ry="44" fill="#fff"/>
        <ellipse cx="100" cy="158" rx="30" ry="26" fill="#fbefe6"/>
        <ellipse cx="58" cy="142" rx="14" ry="28" fill="#2a1a2e" transform="rotate(18 58 142)"/>
        <path d="M44 150 C26 136 30 120 44 128 C58 120 62 136 44 150Z" fill="#e9a3b8"/>
        <g class="wave"><ellipse cx="152" cy="112" rx="13" ry="27" fill="#2a1a2e" transform="rotate(-25 152 112)"/></g>
        <g class="head">
          <ellipse cx="100" cy="88" rx="52" ry="46" fill="#fff"/>
          <ellipse cx="76" cy="86" rx="13" ry="17" fill="#2a1a2e" transform="rotate(-20 76 86)"/>
          <ellipse cx="124" cy="86" rx="13" ry="17" fill="#2a1a2e" transform="rotate(20 124 86)"/>
          <g class="eye" style="transform-origin:78px 84px"><circle cx="78" cy="84" r="6" fill="#fff"/><circle cx="78" cy="85" r="3.6" fill="#2a1a2e"/><circle cx="79.4" cy="83.4" r="1.3" fill="#fff"/></g>
          <g class="eye" style="transform-origin:122px 84px"><circle cx="122" cy="84" r="6" fill="#fff"/><circle cx="122" cy="85" r="3.6" fill="#2a1a2e"/><circle cx="123.4" cy="83.4" r="1.3" fill="#fff"/></g>
          <ellipse cx="100" cy="101" rx="7.5" ry="5" fill="#2a1a2e"/>
          <path d="M91 108 Q96 116 100 107 Q104 116 109 108" fill="none" stroke="#2a1a2e" stroke-width="2.2" stroke-linecap="round"/>
          <circle cx="57" cy="106" r="7" fill="#f4a6bd" opacity=".7"/><circle cx="143" cy="106" r="7" fill="#f4a6bd" opacity=".7"/>
          <g transform="rotate(-8 100 50)">
            <polygon points="100,6 74,52 126,52" fill="#e9a3b8"/>
            <polygon points="100,6 90,24 110,24" fill="#f2cd8f"/>
            <polygon points="86,34 114,34 119,43 81,43" fill="#f2cd8f" opacity=".85"/>
            <ellipse cx="100" cy="52" rx="26" ry="4.5" fill="#c8647f"/>
            <circle cx="100" cy="6" r="6" fill="#f2cd8f"/>
          </g>
        </g>
      </svg>

      <svg class="box" viewBox="0 0 190 105" aria-hidden="true">
        <rect width="190" height="105" rx="6" fill="#c8647f"/>
        <rect x="0" y="80" width="190" height="25" rx="6" fill="#a94d68"/>
        <rect x="80" width="30" height="105" fill="#f2cd8f"/>
      </svg>
      <svg class="lid" viewBox="0 0 210 38" aria-hidden="true">
        <rect width="210" height="38" rx="6" fill="#e9a3b8"/>
        <rect x="90" width="30" height="38" fill="#f2cd8f"/>
        <ellipse cx="86" cy="0" rx="19" ry="10" fill="none" stroke="#f2cd8f" stroke-width="6" transform="rotate(-22 86 0)"/>
        <ellipse cx="124" cy="0" rx="19" ry="10" fill="none" stroke="#f2cd8f" stroke-width="6" transform="rotate(22 124 0)"/>
        <circle cx="105" cy="2" r="7" fill="#f2cd8f"/>
      </svg>
    </div>

    <button class="btn ghost" id="gift" type="button" aria-expanded="false">Open your gift</button>
    <div class="cap" id="cap">A little surprise for you, <span id="capName"></span> ♥</div>
    </div>
  </div>
</section>

<section class="page" id="you">
  <div class="gallery" id="gallery"></div>
</section>

<section class="page" id="letter">
  <h2>A letter for you</h2>
  <div class="letter" id="letterBox" aria-live="polite"></div>
  <div class="ask" id="ask">
    <h2>Will you be my lifetime close friend?</h2>
    <div class="row">
      <button id="yes" type="button">Yes</button>
      <button id="no" type="button">No</button>
    </div>
  </div>
  <div class="win" id="win">
    <h2>Friends for life</h2>
    <p class="serif">Best answer ever, <span id="winName"></span>!</p>
  </div>
</section>

</main>

<script>
(function(){
  /* ---------- EDIT THESE ---------- */
  var letterText = "Dear {name},\n\nYou are one of the people who truly matter in my life. Through busy days and difficult days, your friendship has been a steady source of strength, honesty and laughter.\n\nI am grateful for the way you listen without judging, for the way you stand by me, and for every memory we have shared. Very few people are lucky enough to have a friend like you, and I never take that for granted.\n\nI hope life gives you all the happiness you deserve, and that every dream you carry comes true. Wherever life takes us, I will always be here for you, just as you have always been there for me.\n\nThank you for being you.\n\nYour close friend";
  /* -------------------------------- */

  var name = "", written = false, run = 0;
  var $ = function(s){return document.querySelector(s)};

  function setName(){
    var v = $("#name").value.trim();
    if(!v){ $("#name").focus(); return; }
    name = v;
    document.title = "To my close friend " + name;
    $("#toName").textContent = name;
    $("#capName").textContent = name;
    $("#winName").textContent = name;
    $("#entry").style.display = "none";
    $("#to").classList.add("on");
    $("#reveal").classList.add("on");
    written = false; run++;
    $("#letterBox").textContent = "";
    $("#ask").classList.remove("on"); $("#win").classList.remove("on");
    $("#letterBox").style.display = "";
  }
  $("#setname").onclick = setName;
  $("#name").addEventListener("keydown", function(e){ if(e.key === "Enter") setName(); });

  /* gift -> panda */
  $("#gift").onclick = function(){
    $("#stage").classList.add("open");
    this.setAttribute("aria-expanded","true");
    this.style.display = "none";
    $("#cap").classList.add("on");
    burst();
  };

  /* routing */
  var pages = ["home","you","letter"];
  function route(){
    var h = (location.hash||"#home").slice(1);
    if(pages.indexOf(h) < 0) h = "home";
    pages.forEach(function(p){ $("#"+p).classList.toggle("on", p===h); });
    document.querySelectorAll("nav a").forEach(function(a){ a.classList.toggle("on", a.dataset.p===h); });
    window.scrollTo(0,0);
    if(h==="letter") writeLetter();
  }
  window.addEventListener("hashchange", route);

  /* letter */
  function writeLetter(){
    if(written) return; written = true;
    var id = ++run, txt = letterText.replace("{name}", name || "my friend"), i = 0, box = $("#letterBox");
    function go(){
      if(id !== run) return;
      box.textContent = txt.slice(0,i++);
      if(i <= txt.length){ setTimeout(go, 32); }
      else { burst(); $("#ask").classList.add("on"); }
    }
    go();
  }

  /* the escaping No button + party poppers on Yes */
  var no = $("#no"), yes = $("#yes"), scale = 1;
  function dodge(e){
    e.preventDefault();
    var row = $(".row").getBoundingClientRect(), nb = no.getBoundingClientRect();
    no.style.position = "absolute";
    no.style.left = Math.random() * Math.max(10, row.width - nb.width) + "px";
    no.style.top = Math.random() * Math.max(10, row.height - nb.height) + "px";
    scale = Math.min(scale + .12, 1.6);
    yes.style.transform = "scale(" + scale + ")";
  }
  no.addEventListener("mouseover", dodge);
  no.addEventListener("touchstart", dodge, {passive:false});
  no.addEventListener("click", dodge);

  var cf = [], cfCols = ["#e9a3b8","#c8647f","#f2cd8f","#fbefe6","#ff8fab","#ffd166"];
  function shoot(side){
    var x = side === 0 ? 20 : W - 20;
    for(var i=0;i<70;i++){
      var a = (side === 0 ? 1 : -1);
      cf.push({ x:x, y:H-20, vx:a*(2+Math.random()*10), vy:-(9+Math.random()*13),
        r:Math.random()*6, vr:(Math.random()-.5)*.4, w:5+Math.random()*6, h:3+Math.random()*5,
        c:cfCols[Math.floor(Math.random()*cfCols.length)] });
    }
  }
  function party(){
    ["#pl","#pr"].forEach(function(id){ $(id).classList.remove("on"); void $(id).offsetWidth; $(id).classList.add("on"); });
    if(still) return;
    [0,350,700].forEach(function(d){ setTimeout(function(){ shoot(0); shoot(1); }, d); });
  }
  yes.onclick = function(){
    $("#ask").classList.remove("on");
    $("#win").classList.add("on");
    burst(); party();
  };

  /* photo placeholders */
   /* photos */
  var PHOTOS = [
    "1.jpeg",
    "7.jpeg",
    "3.jpeg",
    "4.jpeg",
    "8.jpeg",
    "2.jpeg",
    "5.jpeg",
    "6.jpeg",
    
  ];
  var gal = document.querySelector("#gallery");
  PHOTOS.forEach(function(src){
    var f = document.createElement("figure");
    var im = document.createElement("img");
    im.src = src;
    im.alt = "";
    im.style.cssText = "width:100%;display:block;border-radius:2px";
    f.appendChild(im);
    gal.appendChild(f);
  });

  /* falling petals */
  var cv = $("#petals"), cx = cv.getContext("2d"), W, H, ps = [];
  var still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function size(){ W = cv.width = innerWidth; H = cv.height = innerHeight; }
  size(); addEventListener("resize", size);
  function mk(top){
    return { x:Math.random()*W, y: top ? -20 : Math.random()*H, r:5+Math.random()*9, v:.4+Math.random()*1,
      s:Math.random()*Math.PI*2, w:.01+Math.random()*.02, a:.25+Math.random()*.5,
      c: ["233,163,184","200,100,127","242,205,143"][Math.floor(Math.random()*3)] };
  }
  for(var i=0;i<(still?0:34);i++) ps.push(mk(false));
  function burst(){ if(still) return; for(var i=0;i<90;i++){ var p = mk(true); p.v += 2; p.a = .9; ps.push(p); } }
  function draw(){
    cx.clearRect(0,0,W,H);
    ps.forEach(function(p,i){
      p.s += p.w; p.y += p.v; p.x += Math.sin(p.s)*.8;
      if(p.y > H + 20){ if(ps.length > 34 && p.v > 2){ ps.splice(i,1); return; } Object.assign(p, mk(true)); }
      cx.save(); cx.translate(p.x,p.y); cx.rotate(p.s);
      cx.fillStyle = "rgba(" + p.c + "," + p.a + ")";
      cx.beginPath(); cx.moveTo(0,-p.r);
      cx.bezierCurveTo(p.r,-p.r*.4,p.r*.7,p.r,0,p.r*.7);
      cx.bezierCurveTo(-p.r*.7,p.r,-p.r,-p.r*.4,0,-p.r);
      cx.fill(); cx.restore();
    });
    for(var j=cf.length-1;j>=0;j--){
      var c = cf[j]; c.vy += .32; c.vx *= .985; c.x += c.vx; c.y += c.vy; c.r += c.vr;
      if(c.y > H + 30){ cf.splice(j,1); continue; }
      cx.save(); cx.translate(c.x,c.y); cx.rotate(c.r); cx.fillStyle = c.c;
      cx.fillRect(-c.w/2,-c.h/2,c.w,c.h); cx.restore();
    }
    requestAnimationFrame(draw);
  }
  if(!still) draw();

  route();
})();
</script>
<audio id="bgm" src="song.mpeg" preload="auto" loop></audio>
<script>
(function(){
  // Put your song file next to this HTML file and name it song.mp3
  // Set START_AT to the second where "Chahun main ya naa" begins (e.g. 62 = 1:02)
  var START_AT = 28;
  var a = document.getElementById("bgm"), started = false;
  function seekAndPlay(){
    if (started) return;
    function go(){
      try { a.currentTime = START_AT; } catch(e){}
      var p = a.play();
      if (p && p.then) p.then(function(){ started = true; clean(); }).catch(function(){});
      else { started = true; clean(); }
    }
    if (a.readyState >= 1) go(); else a.addEventListener("loadedmetadata", go, {once:true});
  }
  var evs = ["click","touchstart","keydown","pointerdown"];
  function clean(){ evs.forEach(function(e){ document.removeEventListener(e, seekAndPlay, true); }); }
  evs.forEach(function(e){ document.addEventListener(e, seekAndPlay, true); });
  seekAndPlay(); // tries immediately; browsers that block autoplay will start on first tap
})();
</script>
